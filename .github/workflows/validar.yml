# ===========================================================================
#  Revalida os notebooks todo mês, executando-os com dados reais do DATASUS.
#  Se a biblioteca PySUS mudar e algum exemplo parar de funcionar, o resultado
#  aparece aqui antes de um usuário travar na primeira célula.
# ===========================================================================
name: Validar notebooks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"   # dia 1 de cada mês, 9h UTC
  push:
    paths: ["**/*.ipynb", "_ferramentas/**"]

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pysus nest_asyncio pandas matplotlib jupyter_client ipykernel nbformat nbclient

      - name: Executar todos os notebooks
        run: |
          python - <<'PY'
          import sys, glob, time
          import nbformat
          from nbclient import NotebookClient
          from nbclient.exceptions import CellExecutionError

          falhas = []
          for caminho in sorted(glob.glob("**/*.ipynb", recursive=True)):
              if ".ipynb_checkpoints" in caminho:
                  continue
              print(f"\n→ {caminho}", flush=True)
              nb = nbformat.read(caminho, as_version=4)
              cliente = NotebookClient(nb, timeout=1800, kernel_name="python3",
                                       allow_errors=False)
              inicio = time.time()
              try:
                  cliente.execute()
                  print(f"  OK ({time.time()-inicio:.0f}s)", flush=True)
              except CellExecutionError as erro:
                  print(f"  FALHOU: {str(erro)[-400:]}", flush=True)
                  falhas.append(caminho)
              except Exception as erro:
                  print(f"  ERRO: {type(erro).__name__}: {str(erro)[-300:]}", flush=True)
                  falhas.append(caminho)

          print(f"\n{'=' * 60}")
          if falhas:
              print(f"{len(falhas)} notebook(s) com problema:")
              for f in falhas:
                  print(f"  - {f}")
              sys.exit(1)
          print("Todos os notebooks continuam funcionando.")
          PY

      - name: Avisar quando quebrar
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = "Notebooks pararam de funcionar";
            const existentes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "validacao",
            });
            if (existentes.data.some(i => i.title === titulo)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titulo,
              labels: ["validacao"],
              body: `A validação automática falhou em ${new Date().toLocaleDateString("pt-BR")}.\n\n`
                  + `Veja o registro da execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`
                  + `Causa mais provável: mudança na biblioteca PySUS ou no catálogo do DATASUS.`,
            });
